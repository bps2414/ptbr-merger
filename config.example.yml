    - "nacional"
    - "O.Filme"
    - "O.Filme."
    - "[PT-BR]"
    - "(PT-BR)"
    - "Dual.PT"
    - "Audio-PT"
    - "PTBR"

  medium_priority:
    - "dual"
    - "DUAL"
    - "Dual.Audio"
    - "Dual-Audio"
    - "DualAudio"
    - "multi"
    - "MULTI"
    - "Multi.Audio"
    - "multi-audio"
    - "Multi-Language"
    - "[ja,pt]"
    - "BR"

  indexer_names_br:
    - "Catalogo Betor"
    - "HDRTorrent"
    - "Rede Torrent"
