radarr:
  url: http://localhost:7878
  api_key: CHANGE_ME
  ptbrmerger_min_score: 10000
  ptbrmerger_profile_name: PTBRMerger
  ptbrmerger_root_folder: D:\data\temp\ptbrmerger
  ptbrmerger_tag_name: ptbrmerger

qbittorrent:
  url: http://localhost:8080
  username: CHANGE_ME
  password: CHANGE_ME

ffmpeg:
  ffmpeg_path: C:\Users\Administrator\AppData\Local\Microsoft\WinGet\Links\ffmpeg.exe
  ffprobe_path: C:\Users\Administrator\AppData\Local\Microsoft\WinGet\Links\ffprobe.exe

sync:
  max_duration_diff_seconds: 30

notifications:
  discord_webhook_url: https://discord.invalid/webhook
  username: PTBRMerger Bot

logging:
  level: INFO
  file: D:\ptbr-merger\ptbrmerger.log

